name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: make check
      # Retrieval quality gate: builds the index and fails below the pack's bar. No model needed.
      - run: make ingest
      - run: make eval-retrieval
